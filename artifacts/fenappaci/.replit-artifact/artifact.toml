kind = "web"
previewPath = "/"
title = "FENAPPACI Website"
version = "1.0.0"
id = "artifacts/fenappaci"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 26251
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/fenappaci run dev"

[services.env]
PORT = "26251"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/fenappaci", "run", "build"]
publicDir = "artifacts/fenappaci/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
