[build]
  command = "pnpm --filter @workspace/fenappaci run build"
  publish = "artifacts/fenappaci/dist/public"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Single-page app: serve index.html for client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "pnpm --filter @workspace/fenappaci run dev"
  targetPort = 5173
  framework = "#custom"
