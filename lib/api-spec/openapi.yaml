openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: FENAPPACI API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: purchase-requests
    description: Purchase request operations
  - name: admin
    description: Admin operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /purchase-requests:
    post:
      operationId: createPurchaseRequest
      tags: [purchase-requests]
      summary: Submit a purchase request
      description: Submit a new product purchase request from a buyer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePurchaseRequest"
      responses:
        "201":
          description: Purchase request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseRequest"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/purchase-requests:
    get:
      operationId: listPurchaseRequests
      tags: [admin]
      summary: List all purchase requests
      description: Get all buyer purchase requests for admin review
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, reviewed, responded]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of purchase requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseRequestList"

  /admin/purchase-requests/{id}:
    get:
      operationId: getPurchaseRequest
      tags: [admin]
      summary: Get a single purchase request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Purchase request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseRequest"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updatePurchaseRequestStatus
      tags: [admin]
      summary: Update purchase request status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePurchaseRequestStatus"
      responses:
        "200":
          description: Updated purchase request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseRequest"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    CreatePurchaseRequest:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
        companyName:
          type: string
        country:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        phone:
          type: string
        product:
          type: string
          minLength: 1
        quantity:
          type: string
        deliveryDestination:
          type: string
        message:
          type: string
      required:
        - fullName
        - country
        - email
        - phone
        - product
        - quantity
        - deliveryDestination

    PurchaseRequest:
      type: object
      properties:
        id:
          type: integer
        fullName:
          type: string
        companyName:
          type: string
          nullable: true
        country:
          type: string
        email:
          type: string
        phone:
          type: string
        product:
          type: string
        quantity:
          type: string
        deliveryDestination:
          type: string
        message:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, reviewed, responded]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - fullName
        - country
        - email
        - phone
        - product
        - quantity
        - deliveryDestination
        - status
        - createdAt
        - updatedAt

    PurchaseRequestList:
      type: object
      properties:
        requests:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseRequest"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - requests
        - total
        - page
        - limit

    UpdatePurchaseRequestStatus:
      type: object
      properties:
        status:
          type: string
          enum: [pending, reviewed, responded]
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message
